server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A API é encaminhada aqui dentro, e não no proxy de fora, de propósito: assim o
    # app funciona por uma única origem em qualquer cenário — acessando direto a porta
    # do container, atrás do Nginx Proxy Manager, ou em dev. O NPM precisa de apenas
    # um Proxy Host apontando para `/`, sem Custom Location extra para /api, e não há
    # CORS em jogo em nenhum caso.
    location /api/ {
        # Resolução via DNS interno do Docker em tempo de requisição (a variável é o
        # que força isso). Sem essa indireção, o nginx resolve `backend` só no
        # start e morre com "host not found in upstream" se o backend ainda não
        # subiu — ou fica com o IP velho depois de um restart do backend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $destino backend:8000;
        proxy_pass http://$destino;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A consulta ao portal da SEFAZ acontece dentro do POST /notas e pode levar
        # até o timeout do adapter (10s) antes de desistir e cair no manual.
        proxy_read_timeout 30s;
    }

    # SPA: qualquer rota do react-router cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O service worker não pode ser cacheado, senão o app fica preso numa versão.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets do Vite têm hash no nome: podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
